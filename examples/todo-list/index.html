<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XRender 待办事项示例</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }
        .input-section {
            padding: 20px;
            border-bottom: 1px solid #eee;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-add {
            background: #667eea;
            color: white;
        }
        .btn-add:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .filter-section {
            padding: 15px 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            border-bottom: 1px solid #eee;
        }
        .filter-btn {
            padding: 8px 16px;
            background: #f5f5f5;
            color: #666;
            border-radius: 20px;
            font-size: 14px;
        }
        .filter-btn:hover {
            background: #e0e0e0;
        }
        .filter-btn.active {
            background: #667eea;
            color: white;
        }
        .todo-list {
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        .todo-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            margin-bottom: 10px;
            background: #f9f9f9;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .todo-item:hover {
            background: #f0f0f0;
            transform: translateX(4px);
        }
        .todo-item.completed {
            opacity: 0.6;
        }
        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #999;
        }
        .checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid #667eea;
            border-radius: 50%;
            margin-right: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .checkbox.checked {
            background: #667eea;
            border-color: #667eea;
        }
        .checkbox.checked::after {
            content: '✓';
            color: white;
            font-size: 14px;
            font-weight: bold;
        }
        .todo-text {
            flex: 1;
            font-size: 16px;
            color: #333;
        }
        .delete-btn {
            padding: 6px 12px;
            background: #ff4757;
            color: white;
            border-radius: 6px;
            font-size: 14px;
        }
        .delete-btn:hover {
            background: #ff3838;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="module">
        import XRender from '../src/libs/core.js';

        const TodoApp = XRender.component('TodoApp', {
            data() {
                return {
                    newTodo: '',
                    todos: [
                        { id: 1, text: '学习 XRender 框架', completed: false },
                        { id: 2, text: '完成项目文档', completed: true },
                        { id: 3, text: '编写单元测试', completed: false }
                    ],
                    filter: 'all'
                };
            },
            computed: {
                filteredTodos() {
                    switch (this.data.filter) {
                        case 'active':
                            return this.data.todos.filter(todo => !todo.completed);
                        case 'completed':
                            return this.data.todos.filter(todo => todo.completed);
                        default:
                            return this.data.todos;
                    }
                },
                stats() {
                    const total = this.data.todos.length;
                    const completed = this.data.todos.filter(t => t.completed).length;
                    const active = total - completed;
                    return { total, completed, active };
                }
            },
            methods: {
                addTodo() {
                    if (!this.data.newTodo.trim()) return;
                    
                    const newTodo = {
                        id: Date.now(),
                        text: this.data.newTodo.trim(),
                        completed: false
                    };
                    
                    this.data.todos.unshift(newTodo);
                    this.data.newTodo = '';
                },
                toggleTodo(id) {
                    const todo = this.data.todos.find(t => t.id === id);
                    if (todo) {
                        todo.completed = !todo.completed;
                    }
                },
                deleteTodo(id) {
                    const index = this.data.todos.findIndex(t => t.id === id);
                    if (index > -1) {
                        this.data.todos.splice(index, 1);
                    }
                },
                setFilter(filterType) {
                    this.data.filter = filterType;
                },
                clearCompleted() {
                    this.data.todos = this.data.todos.filter(todo => !todo.completed);
                }
            },
            render(createElem) {
                const { stats } = this;
                
                return createElem('div', { class: 'container' },
                    createElem('div', { class: 'header' },
                        createElem('h1', {}, '待办事项清单'),
                        createElem('div', { class: 'stats' },
                            createElem('div', { class: 'stat-item' },
                                createElem('div', { class: 'stat-value' }, stats.total),
                                createElem('div', { class: 'stat-label' }, '总计')
                            ),
                            createElem('div', { class: 'stat-item' },
                                createElem('div', { class: 'stat-value' }, stats.active),
                                createElem('div', { class: 'stat-label' }, '进行中')
                            ),
                            createElem('div', { class: 'stat-item' },
                                createElem('div', { class: 'stat-value' }, stats.completed),
                                createElem('div', { class: 'stat-label' }, '已完成')
                            )
                        )
                    ),
                    createElem('div', { class: 'input-section' },
                        createElem('div', { class: 'input-group' },
                            createElem('input', {
                                type: 'text',
                                placeholder: '输入新的待办事项...',
                                value: this.data.newTodo,
                                '@input': (e) => this.data.newTodo = e.target.value,
                                '@keypress': (e) => {
                                    if (e.key === 'Enter') this.addTodo();
                                }
                            }),
                            createElem('button', { class: 'btn-add', '@click': 'addTodo' }, '添加')
                        )
                    ),
                    createElem('div', { class: 'filter-section' },
                        createElem('button', {
                            class: `filter-btn ${this.data.filter === 'all' ? 'active' : ''}`,
                            '@click': () => this.setFilter('all')
                        }, '全部'),
                        createElem('button', {
                            class: `filter-btn ${this.data.filter === 'active' ? 'active' : ''}`,
                            '@click': () => this.setFilter('active')
                        }, '进行中'),
                        createElem('button', {
                            class: `filter-btn ${this.data.filter === 'completed' ? 'active' : ''}`,
                            '@click': () => this.setFilter('completed')
                        }, '已完成')
                    ),
                    createElem('div', { class: 'todo-list' },
                        this.data.filteredTodos.length === 0
                            ? createElem('div', { class: 'empty-state' },
                                createElem('div', { class: 'empty-state-icon' }, '📝'),
                                createElem('p', {}, this.data.filter === 'all' ? '暂无待办事项' : '没有符合条件的待办事项')
                            )
                            : this.data.filteredTodos.map(todo =>
                                createElem('div', {
                                    class: `todo-item ${todo.completed ? 'completed' : ''}`
                                },
                                    createElem('div', {
                                        class: `checkbox ${todo.completed ? 'checked' : ''}`,
                                        '@click': () => this.toggleTodo(todo.id)
                                    }),
                                    createElem('span', { class: 'todo-text' }, todo.text),
                                    createElem('button', {
                                        class: 'delete-btn',
                                        '@click': () => this.deleteTodo(todo.id)
                                    }, '删除')
                                )
                            )
                    )
                );
            }
        });

        XRender.createApp({ App: TodoApp }).$mount('#app');
        console.log('待办事项应用已加载');
    </script>
</body>
</html>
