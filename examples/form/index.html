<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XRender 表单处理示例</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        .header p {
            opacity: 0.9;
        }
        .form-section {
            padding: 30px;
        }
        .form-group {
            margin-bottom: 24px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        .form-group label.required::after {
            content: ' *';
            color: #ff4757;
        }
        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="tel"],
        .form-group input[type="number"],
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .form-group input.error,
        .form-group select.error,
        .form-group textarea.error {
            border-color: #ff4757;
        }
        .error-message {
            color: #ff4757;
            font-size: 14px;
            margin-top: 6px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        .radio-group {
            display: flex;
            gap: 20px;
        }
        .radio-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .radio-item input[type="radio"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .checkbox-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }
        button {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-submit {
            background: #667eea;
            color: white;
        }
        .btn-submit:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .btn-reset {
            background: #f5f5f5;
            color: #666;
        }
        .btn-reset:hover {
            background: #e0e0e0;
        }
        .preview-section {
            background: #f9f9f9;
            padding: 20px;
            border-top: 1px solid #eee;
        }
        .preview-section h3 {
            margin-bottom: 15px;
            color: #667eea;
            font-size: 18px;
        }
        .preview-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }
        .preview-item {
            display: flex;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f0f0f0;
        }
        .preview-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        .preview-label {
            width: 120px;
            font-weight: 600;
            color: #666;
            flex-shrink: 0;
        }
        .preview-value {
            flex: 1;
            color: #333;
        }
        .empty-preview {
            text-align: center;
            color: #999;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="module">
        import XRender from '../src/libs/core.js';

        const FormApp = XRender.component('FormApp', {
            data() {
                return {
                    formData: {
                        name: '',
                        email: '',
                        phone: '',
                        age: '',
                        gender: '',
                        interests: [],
                        bio: ''
                    },
                    errors: {},
                    isSubmitted: false
                };
            },
            computed: {
                isValid() {
                    return Object.keys(this.data.errors).length === 0;
                }
            },
            methods: {
                validateField(field) {
                    const value = this.data.formData[field];
                    const errors = this.data.errors;

                    switch (field) {
                        case 'name':
                            if (!value.trim()) {
                                errors.name = '姓名不能为空';
                            } else if (value.trim().length < 2) {
                                errors.name = '姓名至少需要2个字符';
                            } else {
                                delete errors.name;
                            }
                            break;
                        case 'email':
                            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                            if (!value.trim()) {
                                errors.email = '邮箱不能为空';
                            } else if (!emailRegex.test(value)) {
                                errors.email = '请输入有效的邮箱地址';
                            } else {
                                delete errors.email;
                            }
                            break;
                        case 'phone':
                            const phoneRegex = /^1[3-9]\d{9}$/;
                            if (!value.trim()) {
                                errors.phone = '手机号不能为空';
                            } else if (!phoneRegex.test(value)) {
                                errors.phone = '请输入有效的手机号';
                            } else {
                                delete errors.phone;
                            }
                            break;
                        case 'age':
                            if (!value) {
                                errors.age = '年龄不能为空';
                            } else if (value < 18 || value > 100) {
                                errors.age = '年龄必须在18-100之间';
                            } else {
                                delete errors.age;
                            }
                            break;
                        case 'gender':
                            if (!value) {
                                errors.gender = '请选择性别';
                            } else {
                                delete errors.gender;
                            }
                            break;
                        case 'interests':
                            if (this.data.formData.interests.length === 0) {
                                errors.interests = '请至少选择一个兴趣';
                            } else {
                                delete errors.interests;
                            }
                            break;
                        case 'bio':
                            if (!value.trim()) {
                                errors.bio = '个人简介不能为空';
                            } else if (value.trim().length < 10) {
                                errors.bio = '个人简介至少需要10个字符';
                            } else {
                                delete errors.bio;
                            }
                            break;
                    }
                },
                validateAll() {
                    const fields = ['name', 'email', 'phone', 'age', 'gender', 'interests', 'bio'];
                    fields.forEach(field => this.validateField(field));
                },
                handleSubmit() {
                    this.validateAll();
                    if (this.isValid) {
                        this.data.isSubmitted = true;
                        console.log('表单提交成功:', this.data.formData);
                        alert('表单提交成功！');
                    } else {
                        alert('请检查表单中的错误');
                    }
                },
                handleReset() {
                    this.data.formData = {
                        name: '',
                        email: '',
                        phone: '',
                        age: '',
                        gender: '',
                        interests: [],
                        bio: ''
                    };
                    this.data.errors = {};
                    this.data.isSubmitted = false;
                },
                handleInput(field, value) {
                    this.data.formData[field] = value;
                    if (this.data.isSubmitted) {
                        this.validateField(field);
                    }
                },
                handleBlur(field) {
                    this.validateField(field);
                },
                toggleInterest(interest) {
                    const index = this.data.formData.interests.indexOf(interest);
                    if (index > -1) {
                        this.data.formData.interests.splice(index, 1);
                    } else {
                        this.data.formData.interests.push(interest);
                    }
                    if (this.data.isSubmitted) {
                        this.validateField('interests');
                    }
                }
            },
            render(createElem) {
                const { formData, errors } = this.data;

                return createElem('div', { class: 'container' },
                    createElem('div', { class: 'header' },
                        createElem('h1', {}, '用户注册表单'),
                        createElem('p', {}, '请填写以下信息完成注册')
                    ),
                    createElem('div', { class: 'form-section' },
                        createElem('div', { class: 'form-group' },
                            createElem('label', { class: 'required' }, '姓名'),
                            createElem('input', {
                                type: 'text',
                                placeholder: '请输入您的姓名',
                                value: formData.name,
                                class: errors.name ? 'error' : '',
                                '@input': (e) => this.handleInput('name', e.target.value),
                                '@blur': () => this.handleBlur('name')
                            }),
                            createElem('div', {
                                class: `error-message ${errors.name ? 'show' : ''}`
                            }, errors.name || '')
                        ),
                        createElem('div', { class: 'form-group' },
                            createElem('label', { class: 'required' }, '邮箱'),
                            createElem('input', {
                                type: 'email',
                                placeholder: '请输入您的邮箱',
                                value: formData.email,
                                class: errors.email ? 'error' : '',
                                '@input': (e) => this.handleInput('email', e.target.value),
                                '@blur': () => this.handleBlur('email')
                            }),
                            createElem('div', {
                                class: `error-message ${errors.email ? 'show' : ''}`
                            }, errors.email || '')
                        ),
                        createElem('div', { class: 'form-group' },
                            createElem('label', { class: 'required' }, '手机号'),
                            createElem('input', {
                                type: 'tel',
                                placeholder: '请输入您的手机号',
                                value: formData.phone,
                                class: errors.phone ? 'error' : '',
                                '@input': (e) => this.handleInput('phone', e.target.value),
                                '@blur': () => this.handleBlur('phone')
                            }),
                            createElem('div', {
                                class: `error-message ${errors.phone ? 'show' : ''}`
                            }, errors.phone || '')
                        ),
                        createElem('div', { class: 'form-group' },
                            createElem('label', { class: 'required' }, '年龄'),
                            createElem('input', {
                                type: 'number',
                                placeholder: '请输入您的年龄',
                                value: formData.age,
                                class: errors.age ? 'error' : '',
                                '@input': (e) => this.handleInput('age', parseInt(e.target.value) || ''),
                                '@blur': () => this.handleBlur('age')
                            }),
                            createElem('div', {
                                class: `error-message ${errors.age ? 'show' : ''}`
                            }, errors.age || '')
                        ),
                        createElem('div', { class: 'form-group' },
                            createElem('label', { class: 'required' }, '性别'),
                            createElem('div', { class: 'radio-group' },
                                createElem('label', { class: 'radio-item' },
                                    createElem('input', {
                                        type: 'radio',
                                        name: 'gender',
                                        value: 'male',
                                        checked: formData.gender === 'male',
                                        '@change': (e) => this.handleInput('gender', e.target.value)
                                    }),
                                    '男'
                                ),
                                createElem('label', { class: 'radio-item' },
                                    createElem('input', {
                                        type: 'radio',
                                        name: 'gender',
                                        value: 'female',
                                        checked: formData.gender === 'female',
                                        '@change': (e) => this.handleInput('gender', e.target.value)
                                    }),
                                    '女'
                                )
                            ),
                            createElem('div', {
                                class: `error-message ${errors.gender ? 'show' : ''}`
                            }, errors.gender || '')
                        ),
                        createElem('div', { class: 'form-group' },
                            createElem('label', { class: 'required' }, '兴趣爱好'),
                            createElem('div', { class: 'checkbox-group' },
                                ['编程', '阅读', '运动', '音乐', '旅行', '摄影'].map(interest =>
                                    createElem('label', { class: 'checkbox-item' },
                                        createElem('input', {
                                            type: 'checkbox',
                                            checked: formData.interests.includes(interest),
                                            '@change': () => this.toggleInterest(interest)
                                        }),
                                        interest
                                    )
                                )
                            ),
                            createElem('div', {
                                class: `error-message ${errors.interests ? 'show' : ''}`
                            }, errors.interests || '')
                        ),
                        createElem('div', { class: 'form-group' },
                            createElem('label', { class: 'required' }, '个人简介'),
                            createElem('textarea', {
                                placeholder: '请简单介绍一下自己...',
                                value: formData.bio,
                                class: errors.bio ? 'error' : '',
                                '@input': (e) => this.handleInput('bio', e.target.value),
                                '@blur': () => this.handleBlur('bio')
                            }),
                            createElem('div', {
                                class: `error-message ${errors.bio ? 'show' : ''}`
                            }, errors.bio || '')
                        ),
                        createElem('div', { class: 'form-actions' },
                            createElem('button', { class: 'btn-submit', '@click': 'handleSubmit' }, '提交'),
                            createElem('button', { class: 'btn-reset', '@click': 'handleReset' }, '重置')
                        )
                    ),
                    createElem('div', { class: 'preview-section' },
                        createElem('h3', {}, '实时预览'),
                        createElem('div', { class: 'preview-content' },
                            Object.values(formData).every(v => v === '' || (Array.isArray(v) && v.length === 0))
                                ? createElem('div', { class: 'empty-preview' }, '请填写表单以查看预览')
                                : createElem('div', {},
                                    createElem('div', { class: 'preview-item' },
                                        createElem('span', { class: 'preview-label' }, '姓名：'),
                                        createElem('span', { class: 'preview-value' }, formData.name || '-')
                                    ),
                                    createElem('div', { class: 'preview-item' },
                                        createElem('span', { class: 'preview-label' }, '邮箱：'),
                                        createElem('span', { class: 'preview-value' }, formData.email || '-')
                                    ),
                                    createElem('div', { class: 'preview-item' },
                                        createElem('span', { class: 'preview-label' }, '手机号：'),
                                        createElem('span', { class: 'preview-value' }, formData.phone || '-')
                                    ),
                                    createElem('div', { class: 'preview-item' },
                                        createElem('span', { class: 'preview-label' }, '年龄：'),
                                        createElem('span', { class: 'preview-value' }, formData.age || '-')
                                    ),
                                    createElem('div', { class: 'preview-item' },
                                        createElem('span', { class: 'preview-label' }, '性别：'),
                                        createElem('span', { class: 'preview-value' }, formData.gender === 'male' ? '男' : formData.gender === 'female' ? '女' : '-')
                                    ),
                                    createElem('div', { class: 'preview-item' },
                                        createElem('span', { class: 'preview-label' }, '兴趣爱好：'),
                                        createElem('span', { class: 'preview-value' }, formData.interests.join(', ') || '-')
                                    ),
                                    createElem('div', { class: 'preview-item' },
                                        createElem('span', { class: 'preview-label' }, '个人简介：'),
                                        createElem('span', { class: 'preview-value' }, formData.bio || '-')
                                    )
                                )
                        )
                    )
                );
            }
        });

        XRender.createApp({ App: FormApp }).$mount('#app');
        console.log('表单处理应用已加载');
    </script>
</body>
</html>
